{% extends "app_base.html" %}
{% block title %}Fund Wallet · UPay{% endblock %}
{% block page %}
<div class="form-page">
    <h2>Fund Wallet</h2>
    <p class="form-subtitle">Simulated top-up — no real card or bank details required.</p>

    <form method="POST" class="stacked-form">
        <label>Amount (₦)
            <input type="number" name="amount" min="1" step="0.01" placeholder="e.g. 5000" required autofocus>
        </label>

        <div class="quick-amounts">
            <button type="button" class="chip" data-amount="1000">₦1,000</button>
            <button type="button" class="chip" data-amount="5000">₦5,000</button>
            <button type="button" class="chip" data-amount="10000">₦10,000</button>
            <button type="button" class="chip" data-amount="50000">₦50,000</button>
        </div>

        <div class="fake-card-preview">
            <div class="fake-card">
                <span>💳 SIMULATED CARD</span>
                <span>•••• •••• •••• 4242</span>
                <span class="fake-card-note">No real payment is processed</span>
            </div>
        </div>

        <button type="submit" class="btn-primary">Fund Wallet</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelector('input[name="amount"]').value = btn.dataset.amount;
    });
});
</script>
{% endblock %}
