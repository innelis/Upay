{% extends "base.html" %}
{% block title %}Log in · UPay{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">💳</div>
            <h1>UPay</h1>
            <p>Your simulated digital wallet.</p>
        </div>
        <form method="POST" class="auth-form">
            <label>Username
                <input type="text" name="username" placeholder="e.g. johndoe" required autofocus>
            </label>
            <label>Password
                <input type="password" name="password" placeholder="Your password" required>
            </label>
            <button type="submit" class="btn-primary">Log in</button>
        </form>
        <p class="auth-switch">New to UPay? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
