{% extends "app_base.html" %}
{% block title %}Profile · UPay{% endblock %}
{% block page %}
<div class="form-page">
    <div class="profile-header">
        <div class="avatar avatar-lg" style="background:{{ current_user.avatar_color }}">{{ current_user.initials() }}</div>
        <h2>{{ current_user.full_name }}</h2>
        <p>@{{ current_user.username }} · {{ current_user.phone }}</p>
        <p class="acct-number">Account No: {{ current_user.account_number }}</p>
    </div>

    <form method="POST" class="stacked-form">
        <label>Full name
            <input type="text" name="full_name" value="{{ current_user.full_name }}">
        </label>
        <button type="submit" class="btn-primary">Save changes</button>
    </form>
</div>
{% endblock %}
