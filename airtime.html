{% extends "app_base.html" %}
{% block title %}Buy Airtime · UPay{% endblock %}
{% block page %}
<div class="form-page">
    <h2>Buy Airtime</h2>
    <p class="form-subtitle">Simulated top-up — no real airtime is sent.</p>

    <form method="POST" class="stacked-form">
        <label>Network
            <select name="network" required>
                <option value="">Select network</option>
                {% for n in networks %}
                <option value="{{ n }}">{{ n }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Phone number
            <input type="text" name="phone" placeholder="e.g. 08012345678" required autofocus>
        </label>
        <label>Amount (₦)
            <input type="number" name="amount" min="1" step="0.01" placeholder="e.g. 500" required>
        </label>

        <div class="quick-amounts">
            <button type="button" class="chip" data-amount="100">₦100</button>
            <button type="button" class="chip" data-amount="500">₦500</button>
            <button type="button" class="chip" data-amount="1000">₦1,000</button>
            <button type="button" class="chip" data-amount="2000">₦2,000</button>
        </div>

        <label>Transaction PIN
            <input type="password" name="pin" maxlength="4" pattern="\d{4}" inputmode="numeric" placeholder="4-digit PIN" required>
        </label>
        <button type="submit" class="btn-primary">Buy Airtime</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelector('input[name="amount"]').value = btn.dataset.amount;
    });
});
</script>
{% endblock %}
