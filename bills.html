{% extends "app_base.html" %}
{% block title %}Pay Bills · UPay{% endblock %}
{% block page %}
<div class="form-page">
    <h2>Pay Bills</h2>
    <p class="form-subtitle">Simulated bill payment — no real biller is contacted.</p>

    <form method="POST" class="stacked-form">
        <label>Biller
            <select name="biller" required>
                <option value="">Select biller</option>
                {% for b in billers %}
                <option value="{{ b }}">{{ b }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Meter / Account / Customer number
            <input type="text" name="account_ref" placeholder="e.g. 04512345678" required autofocus>
        </label>
        <label>Amount (₦)
            <input type="number" name="amount" min="1" step="0.01" placeholder="e.g. 3000" required>
        </label>
        <label>Transaction PIN
            <input type="password" name="pin" maxlength="4" pattern="\d{4}" inputmode="numeric" placeholder="4-digit PIN" required>
        </label>
        <button type="submit" class="btn-primary">Pay Bill</button>
    </form>
</div>
{% endblock %}
