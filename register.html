{% extends "base.html" %}
{% block title %}Sign up · UPay{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">💳</div>
            <h1>UPay</h1>
            <p>Create your account — you'll get a demo balance to play with.</p>
        </div>
        <form method="POST" class="auth-form">
            <label>Full name
                <input type="text" name="full_name" placeholder="e.g. John Doe" required autofocus>
            </label>
            <label>Username
                <input type="text" name="username" placeholder="e.g. johndoe" required>
            </label>
            <label>Phone number
                <input type="text" name="phone" placeholder="e.g. 08012345678" required>
            </label>
            <label>Password
                <input type="password" name="password" placeholder="At least 6 characters" required>
            </label>
            <label>Confirm password
                <input type="password" name="confirm_password" placeholder="Repeat password" required>
            </label>
            <label>4-digit transaction PIN
                <input type="password" name="pin" placeholder="e.g. 1234" maxlength="4" pattern="\d{4}" inputmode="numeric" required>
            </label>
            <button type="submit" class="btn-primary">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
